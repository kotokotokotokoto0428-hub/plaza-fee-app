<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153b50">
  <title>施設利用料金区分 判定アプリ</title>
  <style>
    :root { --navy:#153b50; --muted:#64748b; --line:#dbe4ea; --bg:#f3f7f9; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:#172b3a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { background:var(--navy); color:white; padding:28px 18px; text-align:center; }
    header h1 { margin:0 0 8px; font-size:clamp(1.25rem,4vw,1.8rem); }
    header p { margin:0; opacity:.9; font-size:.94rem; }
    main { width:min(760px, calc(100% - 28px)); margin:24px auto 48px; }
    .panel { background:white; border:1px solid var(--line); border-radius:16px; padding:22px; margin:16px 0; box-shadow:0 5px 18px #18384b0b; }
    h2 { font-size:1.12rem; margin:0 0 16px; }
    .step { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%; background:#e5f1f6; color:var(--navy); font-weight:800; margin-right:8px; }
    .choices { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
    label.choice { display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:11px; padding:14px; cursor:pointer; min-height:54px; }
    label.choice:has(input:checked) { border:2px solid #26799a; background:#f0f8fb; padding:13px; }
    input[type=radio] { accent-color:#26799a; width:18px; height:18px; flex:none; }
    .hint { color:var(--muted); font-size:.9rem; line-height:1.6; margin:10px 0 0; }
    .fee-wrap { display:flex; align-items:center; gap:10px; }
    input[type=number] { width:100%; max-width:260px; padding:13px; border:1px solid #bdcbd4; border-radius:10px; font:inherit; font-size:1.05rem; }
    .yen { color:var(--muted); }
    button { border:0; border-radius:10px; padding:13px 20px; font:inherit; font-weight:700; cursor:pointer; }
    .primary { background:var(--navy); color:white; width:100%; margin-top:18px; }
    .secondary { background:#e8eef2; color:#243b4a; }
    button:focus-visible, input:focus-visible { outline:3px solid #83c9e3; outline-offset:2px; }
    #result { display:none; }
    #result.show { display:block; }
    .result-card { border-radius:14px; padding:22px; text-align:center; color:#102a39; }
    .result-card h2 { margin:0 0 8px; }
    .result-card .category { font-size:clamp(1.8rem,7vw,2.5rem); font-weight:900; margin:8px 0; }
    .commercial { background:#ffeadf; border:2px solid #ef6b2c; }
    .middle { background:#e9f6e4; border:2px solid #56a83c; }
    .normal { background:#e2f4fb; border:2px solid #159bd0; }
    .other { background:#f1f0fa; border:2px solid #8b83c5; }
    .details { margin-top:14px; color:#425466; font-size:.94rem; line-height:1.7; }
    .warning { background:#fff8e8; border:1px solid #f1d38a; border-radius:10px; padding:13px; color:#694b12; line-height:1.6; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    footer { color:var(--muted); font-size:.82rem; text-align:center; padding:0 10px 30px; line-height:1.6; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<header>
  <h1>施設利用料金区分 判定アプリ</h1>
  <p>ムジカホール・茶霧茶霧ギャラリー</p>
</header>
<main>
  <section class="panel">
    <h2><span class="step">1</span>利用する施設を選択</h2>
    <div class="choices">
      <label class="choice"><input type="radio" name="facility" value="ムジカホール">ムジカホール</label>
      <label class="choice"><input type="radio" name="facility" value="茶霧茶霧ギャラリー">茶霧茶霧ギャラリー</label>
      <label class="choice"><input type="radio" name="facility" value="その他">その他</label>
    </div>
    <p class="hint">「その他」は施設共通フローチャートでの確認が必要です。今回の資料にはその判定条件が含まれていないため、このアプリでは別扱いにしています。</p>
  </section>

  <section class="panel" id="purposePanel">
    <h2><span class="step">2</span>利用目的・内容を選択</h2>
    <div class="choices">
      <label class="choice"><input type="radio" name="purpose" value="enterprise">企業利用（文化利用を除く）</label>
      <label class="choice"><input type="radio" name="purpose" value="sales">主な内容が営業・販売</label>
      <label class="choice"><input type="radio" name="purpose" value="members">会員招待のみ（一般の観客は含まない）</label>
      <label class="choice"><input type="radio" name="purpose" value="culture">文化利用（企業団体も含む）</label>
      <label class="choice"><input type="radio" name="purpose" value="other">その他</label>
    </div>
  </section>

  <section class="panel" id="feePanel">
    <h2><span class="step">3</span>入場料はいくらですか？</h2>
    <p class="hint">当日券を含む最高料金を入力してください。</p>
    <div class="fee-wrap">
      <input id="fee" type="number" min="0" step="1" inputmode="numeric" placeholder="例：1500" aria-label="入場料（円）">
      <span class="yen">円</span>
    </div>
  </section>

  <button class="primary" id="judgeBtn" type="button">料金区分を判定する</button>

  <section class="panel" id="result" aria-live="polite">
    <div id="resultCard" class="result-card">
      <h2>判定結果</h2>
      <div class="category" id="category"></div>
      <div id="resultSummary"></div>
    </div>
    <div class="details" id="details"></div>
    <div class="actions">
      <button class="secondary" id="resetBtn" type="button">最初からやり直す</button>
    </div>
  </section>
</main>
<footer>
  本アプリは提供されたフローチャートをもとにした判定補助ツールです。<br>
  実際の料金決定・適用にあたっては、施設の最新の利用規程・担当窓口でご確認ください。
</footer>
<script>
  const $ = (id) => document.getElementById(id);
  const selected = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value;

  function showResult(type, title, summary, detail) {
    const card = $("resultCard");
    card.className = `result-card ${type}`;
    $("category").textContent = title;
    $("resultSummary").textContent = summary;
    $("details").textContent = detail;
    $("result").classList.add("show");
    $("result").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  $("judgeBtn").addEventListener("click", () => {
    const facility = selected("facility");
    const purpose = selected("purpose");
    const feeText = $("fee").value.trim();

    if (!facility) { alert("利用する施設を選択してください。"); return; }
    if (facility === "その他") {
      showResult("other", "施設共通フローチャートへ", "この施設の判定は別フローチャートで確認してください。",
        "STEP1で「その他」を選択した場合は、施設共通フローチャートへ進みます。共通フローチャートの内容は今回のPDFに含まれていません。");
      return;
    }
    if (!purpose) { alert("利用目的・内容を選択してください。"); return; }

    if (purpose === "enterprise" || purpose === "sales") {
      showResult("commercial", "営利料金", `${facility} ／ 利用目的・内容による判定`,
        purpose === "enterprise"
          ? "企業利用（文化利用を除く）のため、入場料にかかわらず営利料金です。"
          : "主な内容が営業・販売のため、入場料にかかわらず営利料金です。");
      return;
    }

    if (feeText === "" || !Number.isFinite(Number(feeText)) || Number(feeText) < 0) {
      alert("当日券を含む最高入場料を0円以上で入力してください。"); return;
    }
    const fee = Number(feeText);
    if (!Number.isInteger(fee)) { alert("入場料は1円単位の整数で入力してください。"); return; }

    if (purpose === "members") {
      if (fee >= 2001) {
        showResult("commercial", "営利料金", `${facility} ／ 会員招待のみ ／ ${fee.toLocaleString("ja-JP")}円`,
          "会員招待のみ（一般の観客は含まない）で、入場料が2,001円以上のため営利料金です。");
      } else {
        showResult("middle", "中段料金", `${facility} ／ 会員招待のみ ／ ${fee.toLocaleString("ja-JP")}円`,
          "会員招待のみ（一般の観客は含まない）で、入場料が2,000円以下のため中段料金です。");
      }
      return;
    }

    // 文化利用・その他
    if (fee >= 2001) {
      showResult("commercial", "営利料金", `${facility} ／ ${purpose === "culture" ? "文化利用" : "その他"} ／ ${fee.toLocaleString("ja-JP")}円`,
        "入場料が2,001円以上のため営利料金です。");
    } else if (fee >= 501) {
      showResult("middle", "中段料金", `${facility} ／ ${purpose === "culture" ? "文化利用" : "その他"} ／ ${fee.toLocaleString("ja-JP")}円`,
        "入場料が501円～2,000円のため中段料金です。");
    } else {
      showResult("normal", "通常料金", `${facility} ／ ${purpose === "culture" ? "文化利用" : "その他"} ／ ${fee.toLocaleString("ja-JP")}円`,
        "入場料が500円以下のため通常料金です。");
    }
  });

  $("resetBtn").addEventListener("click", () => {
    document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
    $("fee").value = "";
    $("result").classList.remove("show");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>
</body>
</html>
